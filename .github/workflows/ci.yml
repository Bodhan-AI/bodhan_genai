name: ci

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .
      # The dead-name gate greps the tracked tree, so it needs the checkout and nothing else.
      # fetch-depth above is the default shallow clone, which `git grep` is fine with.
      - run: scripts/rename_gate.sh

  # One job for the whole suite: both modalities share an environment, so there is
  # one dependency set to install and no reason to split.
  test-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-ci.txt
      # Pins are already satisfied by the requirements file; --no-deps avoids the
      # resolver pulling GPU-only wheels (vllm, ray, flash-attn) on a CPU runner.
      - run: pip install -e . --no-deps
      - run: pytest -m "not gpu and not slow" -ra --tb=short

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
