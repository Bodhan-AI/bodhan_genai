# bodhan_genai pretraining configuration
#
# Launch with:
#   scripts/tts/train.sh configs/tts/train/pretrain.yaml
# or directly:
#   accelerate launch --config_file configs/tts/accelerate/single_node_fsdp.yaml \
#       -m bodhan_genai.tts.training.train configs/tts/train/pretrain.yaml

# === Training stage ===
# One of: pt | cpt | sft | ft | dpo | rlhf. Used in auto-generated wandb run names.
training_stage: "pt"

# === Model ===
model:
  model_path: "bodhan-ai/indic-speak"   # HF model ID or local checkpoint path
  # model_path: /path/to/checkpoints/orpheus_3B_pt
  tokenizer_path: ""                # REQUIRED: extended audio tokenizer path (156942 tokens)
  # tokenizer_path: /path/to/checkpoints/llama-3-audio-tok_trimmed
  max_seq_len: 8192                 # source production run used 34816 across 16 nodes
  attn_implementation: "flash_attention_2"
  torch_dtype: "bfloat16"
  activation_checkpointing: false   # FSDP owns activation checkpointing (configs/tts/accelerate/single_node_fsdp.yaml); never both
  compile: true
  compile_mode: "max-autotune-no-cudagraphs"
  snac_model_path: "hubertsiuzdak/snac_24khz"   # SNAC codec for audio decoding
  # snac_model_path: /path/to/checkpoints/snac/snac_24khz

# === Data ===
# Each dataset entry has:
#   path:  path to a directory of .parquet files (columns: input_ids, labels, length)
#   ratio: relative sampling weight (normalized internally)
#   name:  identifier (for logging)
data:
  train:
    packing:
      backend: "auto"               # auto | sortedlist | bucket | numba_bucket | linear
      rank_local: false             # pre-shard rows per rank before packing
      equalize_rank_bins: true      # pad local bins so all ranks run same steps
    datasets:
      # Replace with your compiled pretraining parquet directories.
      - { path: "data/pretrain/train/hi", ratio: 1.0, name: "hi" }
      - { path: "data/pretrain/train/en", ratio: 1.0, name: "en" }
  val:
    datasets:
      - { path: "data/pretrain/val/hi", ratio: 1.0, name: "hi_val" }
      - { path: "data/pretrain/val/en", ratio: 1.0, name: "en_val" }

# === Training arguments (passed to transformers.TrainingArguments) ===
training:
  output_dir: "training_checkpoints/pretrain"
  num_train_epochs: 2
  gradient_accumulation_steps: 8
  learning_rate: 1.0e-4
  weight_decay: 0.01
  warmup_steps: 500
  lr_scheduler_type: "cosine"
  optim: "adamw_torch_fused"
  max_grad_norm: 1.0
  bf16: true
  logging_steps: 20
  save_strategy: "steps"
  save_steps: 500
  eval_strategy: "steps"
  eval_steps: 500
  save_total_limit: null            # REQUIRED null — BestAndLastCheckpointKeeper owns retention
  seed: 42
  dataloader_num_workers: 8
  dataloader_pin_memory: true
  prefetch_factor: 8                # popped before TrainingArguments; feeds DataLoader prefetch
  remove_unused_columns: false

# === Checkpoint retention ===
checkpoint_retention:
  last_n: 2
  best_k: 2
  metric: "eval_loss"

# === Logging ===
logging:
  wandb_project: "bodhan-genai"
